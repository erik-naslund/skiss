# Issue #53, S4. The workflows pin every action by commit SHA, which only
# stays current if something proposes the updates; npm is here for the same
# reason. Grouped, so an update is one pull request to review rather than one
# per dependency.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ['*']
    ignore:
      # TypeScript 7 is the Go-based compiler. tsup's declaration bundler
      # (rollup-plugin-dts) calls an API it no longer has, so the build
      # crashes before a test runs (#56). Lift this once tsup supports 7;
      # minor and patch updates still come through.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

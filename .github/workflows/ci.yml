name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    name: Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The runner has python3, so `pnpm verify` would build its own .venv and
      # validate the fixtures a second time. The LinkML job below is the one
      # place CI does that (issue #29).
      - run: pnpm verify
        env:
          SKISS_SKIP_LINKML: '1'

      - run: pnpm build

  linkml:
    name: LinkML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: scripts/linkml-env.sh
      - run: scripts/validate-linkml.sh

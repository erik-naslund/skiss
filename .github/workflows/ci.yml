name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nothing in these jobs writes to the repository (issue #53, S2).
permissions:
  contents: read

jobs:
  node:
    name: Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The runner has python3, so `pnpm verify` would build its own .venv and
      # validate the fixtures a second time. The LinkML job below is the one
      # place CI does that (issue #29).
      - run: pnpm verify
        env:
          SKISS_SKIP_LINKML: '1'

      - run: pnpm build

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # On every pull request, not only the ones that touch release.yml: a
      # change to `files`, `exports`, `bin` or `engines` breaks the published
      # package and nothing else here would see it (issue #53, S1).
      - run: scripts/check-package.sh

  engines:
    # `engines.node` says >= 20 and nothing tested it (issue #53, S5). The
    # test toolchain cannot run there — vitest 5 asks for 22.12 or newer — so
    # what is proved here is the claim itself: the package as published runs
    # on the oldest Node it says it supports. Built with the toolchain's Node,
    # then run with that one.
    name: Node 20 runs the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node 22 to build with
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Set up Node 20, the oldest `engines` allows
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Both entry points work there
        run: |
          node --version
          node dist/cli.js --version
          node dist/cli.js diagram test/fixtures/basic.skiss > /dev/null
          node dist/cli.js compile test/fixtures/basic.skiss > /dev/null
          node dist/cli.js import test/fixtures/foreign.linkml.yaml > /dev/null
          node --input-type=module -e "
            import { compile, importLinkML, VERSION } from './dist/index.js';
            const { output, diagnostics } = compile('Ship\n  id*\n', { target: 'mermaid' });
            if (diagnostics.length > 0 || !output.startsWith('classDiagram')) process.exit(1);
            if (importLinkML('name: x\n').dropped.length !== 1) process.exit(1);
            console.log('the library runs on', process.version, 'at', VERSION);
          "

  linkml:
    name: LinkML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - run: scripts/linkml-env.sh
      - run: scripts/validate-linkml.sh

name: Release

# Publishes the package to npm when a version tag is pushed (docs/RELEASING.md).
# Tags only: this file used to also run on pull requests that changed it, with
# `npm publish --dry-run` in place of the publish, but a dry run of a version
# that is already on npm fails ("You cannot publish over the previously
# published versions"), which is every pull request between two releases. What
# that run actually proved is the packed contents, and the Package job of
# ci.yml now proves those on every pull request instead (issue #53, S1).
#
# Publishing uses npm trusted publishing: npmjs.com is configured to accept
# this repository's `release.yml` as a publisher and the job authenticates
# with a GitHub OIDC token (`id-token: write`). There is no npm token to
# store or rotate.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node 22 with the npm registry
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships an older one.
      - run: npm install -g npm@^11.5.1
      - run: npm --version

      - run: pnpm install --frozen-lockfile

      # No pip install in the job that holds the OIDC token: the LinkML gate
      # runs on every pull request and on main, in its own job, and installing
      # a third-party toolchain here would run its build code next to the
      # credential that publishes the package (issue #53, S3).
      - run: pnpm verify
        env:
          SKISS_SKIP_LINKML: '1'

      - run: pnpm build

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # The same check the Package job of ci.yml runs on every pull request
      # (issue #53, S1), so what is proved there is what is published here.
      - name: Check the packed contents
        run: scripts/check-package.sh

      - name: Publish
        # `--provenance=false` because provenance requires a public source
        # repository; drop the flag once this repository is public.
        run: npm publish --access public --provenance=false

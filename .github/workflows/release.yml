name: Release

# Publishes the package to npm when a version tag is pushed (docs/RELEASING.md).
# On pull requests that touch this file the same job runs `npm publish --dry-run`
# instead, so the publishing path itself is exercised before a tag exists. The
# packed contents are checked here and, on every pull request, by the Package
# job of ci.yml.
#
# Publishing uses npm trusted publishing: npmjs.com is configured to accept
# this repository's `release.yml` as a publisher and the job authenticates
# with a GitHub OIDC token (`id-token: write`). There is no npm token to
# store or rotate.
on:
  push:
    tags: ['v*.*.*']
  pull_request:
    paths: ['.github/workflows/release.yml']

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node 22 with the npm registry
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships an older one.
      - run: npm install -g npm@^11.5.1
      - run: npm --version

      - run: pnpm install --frozen-lockfile

      # No pip install in the job that holds the OIDC token: the LinkML gate
      # runs on every pull request and on main, in its own job, and installing
      # a third-party toolchain here would run its build code next to the
      # credential that publishes the package (issue #53, S3).
      - run: pnpm verify
        env:
          SKISS_SKIP_LINKML: '1'

      - run: pnpm build

      - name: Check that the tag matches package.json
        if: github.event_name == 'push'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # The same check the Package job of ci.yml runs on every pull request
      # (issue #53, S1), so what is proved there is what is published here.
      - name: Check the packed contents
        run: scripts/check-package.sh

      - name: Publish (dry run)
        if: github.event_name == 'pull_request'
        run: npm publish --dry-run --access public

      - name: Publish
        if: github.event_name == 'push'
        # `--provenance=false` because provenance requires a public source
        # repository; drop the flag once this repository is public.
        run: npm publish --access public --provenance=false
